<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none" role="img" aria-label="Emre — ConquerorX">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06070d"/>
      <stop offset="0.55" stop-color="#08080f"/>
      <stop offset="1" stop-color="#0c0714"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(230 40) rotate(38) scale(460 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1010 330) rotate(-40) scale(420 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.04" fill="none"/>
    </pattern>
    <radialGradient id="gridFade" cx="0" cy="0" r="1" gradientTransform="translate(600 190) scale(620 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="380" fill="url(#gridFade)"/>
    </mask>
    <linearGradient id="nameGrad" x1="72" y1="196" x2="520" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2fdff"/>
      <stop offset="0.45" stop-color="#7ce7f7"/>
      <stop offset="1" stop-color="#b98cff"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="760" y1="60" x2="1040" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }
      .sans { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .spin-slow { animation: spin 26s linear infinite; transform-origin: 900px 190px; }
      .spin-rev { animation: spin 18s linear infinite reverse; transform-origin: 900px 190px; }
      .pulse { animation: pulse 4s ease-in-out infinite; transform-origin: 900px 190px; }
      .caret { animation: blink 1.1s step-end infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <rect width="1200" height="380" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="380" fill="url(#glowA)"/>
  <rect width="1200" height="380" fill="url(#glowB)"/>

  <!-- top hairline -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#lineGrad)" opacity="0.8"/>

  <!-- left content -->
  <text x="72" y="104" class="mono" font-size="13" letter-spacing="6" fill="#22d3ee" fill-opacity="0.85">// CONQUERORX</text>
  <text x="70" y="200" class="sans" font-size="82" font-weight="800" letter-spacing="-2" fill="url(#nameGrad)">EMRE</text>
  <text x="72" y="240" class="sans" font-size="19" fill="#c9d1e0" fill-opacity="0.9">Systems-level C++ · Flutter · TypeScript</text>

  <!-- terminal chip -->
  <g class="float">
    <rect x="72" y="272" width="486" height="54" rx="12" fill="#0a0d16" stroke="#22d3ee" stroke-opacity="0.28"/>
    <rect x="72" y="272" width="486" height="54" rx="12" fill="#22d3ee" fill-opacity="0.03"/>
    <circle cx="94" cy="287" r="4" fill="#ff5f57" fill-opacity="0.7"/>
    <circle cx="110" cy="287" r="4" fill="#febc2e" fill-opacity="0.7"/>
    <circle cx="126" cy="287" r="4" fill="#28c840" fill-opacity="0.7"/>
    <text x="94" y="312" class="mono" font-size="14" fill="#7ce7f7">$ whoami</text>
    <text x="182" y="312" class="mono" font-size="14" fill="#9aa7bd">low-level &amp; product dev</text>
    <rect x="392" y="299" width="9" height="16" fill="#22d3ee" class="caret"/>
  </g>

  <!-- right HUD -->
  <g>
    <circle cx="900" cy="190" r="132" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle cx="900" cy="190" r="132" fill="#22d3ee" fill-opacity="0.02"/>
    <g class="spin-slow">
      <circle cx="900" cy="190" r="156" stroke="url(#ringGrad)" stroke-opacity="0.45" stroke-dasharray="3 10" stroke-linecap="round"/>
      <circle cx="1056" cy="190" r="4" fill="#22d3ee"/>
    </g>
    <g class="spin-rev">
      <circle cx="900" cy="190" r="108" stroke="#a855f7" stroke-opacity="0.35" stroke-dasharray="2 8" stroke-linecap="round"/>
      <circle cx="900" cy="82" r="3.5" fill="#a855f7"/>
    </g>
    <circle cx="900" cy="190" r="96" fill="#0a0d16" fill-opacity="0.7"/>
    <circle cx="900" cy="190" r="96" stroke="url(#ringGrad)" stroke-opacity="0.5"/>

    <text x="900" y="208" text-anchor="middle" class="sans" font-size="56" font-weight="800" letter-spacing="2" fill="url(#ringGrad)">CX</text>
    <text x="900" y="238" text-anchor="middle" class="mono" font-size="11" letter-spacing="4" fill="#8b95a8">SINCE 2021</text>

    <!-- corner brackets -->
    <path d="M1064 96h34v34" stroke="#22d3ee" stroke-opacity="0.5" stroke-linecap="round"/>
    <path d="M736 96h-34v34" stroke="#a855f7" stroke-opacity="0.5" stroke-linecap="round"/>
    <path d="M736 284h-34v-34" stroke="#22d3ee" stroke-opacity="0.35" stroke-linecap="round"/>
    <path d="M1064 284h34v-34" stroke="#a855f7" stroke-opacity="0.35" stroke-linecap="round"/>

    <circle cx="900" cy="190" r="176" stroke="#ffffff" stroke-opacity="0.05"/>
  </g>

  <!-- bottom hairline -->
  <rect x="0" y="379" width="1200" height="1" fill="url(#lineGrad)" opacity="0.55"/>
</svg>
